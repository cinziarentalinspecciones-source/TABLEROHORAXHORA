<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinzia Rental · Hora a Hora</title>
<style>
:root{
  --bg:#14181d; --panel:#1c2128; --panel2:#20262e; --line:#323a44;
  --steel:#3d4753; --amber:#f5a524; --amber-dim:#8a5f16;
  --ok:#2ecc71; --warn:#f5a524; --bad:#e74c3c; --crit:#8b1a1a;
  --txt:#eef1f4; --muted:#8b96a3; --curso:#3aa0ff;
  --font: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --fontbody: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55)),
    repeating-linear-gradient(135deg, #10131700, #10131700 40px, #ffffff05 40px, #ffffff05 42px),
    var(--bg);
  color:var(--txt); font-family:var(--fontbody);
  height:100vh; overflow:hidden; display:flex; flex-direction:column;
}
.hdr{
  flex:0 0 auto; display:flex; align-items:center; gap:22px;
  padding:14px 28px; background:linear-gradient(180deg,#1a1f26,#12161b);
  border-bottom:4px solid var(--amber); position:relative; z-index:20;
}
.hdr::before{content:'';position:absolute;left:0;right:0;bottom:-4px;height:4px;
  background:repeating-linear-gradient(90deg,#000 0 24px,var(--amber) 24px 48px); opacity:.9}
.logo{background:#fff;border-radius:6px;padding:6px 12px;display:flex;align-items:center;height:44px}
.logo img{height:30px;display:block}
.ttl{font-family:var(--font);font-size:34px;letter-spacing:1.5px;line-height:1;color:#fff}
.ttl small{display:block;font-family:var(--fontbody);font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-top:2px}
.clock{margin-left:auto;text-align:right}
.clock .t{font-family:var(--font);font-size:44px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.btn{background:#262d36;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:#2f3843}
.btn.primary{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.off{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;text-align:center;font-weight:800;padding:8px;z-index:100;display:none}
.wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--line);overflow:hidden}
.panel{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.panel-hdr{
  flex:0 0 auto; display:flex; align-items:center; gap:16px; padding:14px 22px;
  background:linear-gradient(90deg,#1e242c,#161a20); border-bottom:2px solid var(--steel);
}
.panel-hdr .suc-pill{
  font-family:var(--font); font-size:26px; letter-spacing:2px; color:#fff;
  background:var(--steel); padding:4px 16px; border-radius:6px; border-left:6px solid var(--amber);
}
.panel-hdr .suc-count{font-size:13px;color:var(--muted);font-weight:700}
.gauge{margin-left:auto;display:flex;align-items:center;gap:12px}
.gauge .num{font-family:var(--font);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.gauge .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:right}
.gauge.g .num{color:var(--ok)} .gauge.w .num{color:var(--warn)} .gauge.b .num{color:var(--bad)}
.rows{flex:1;overflow-y:auto;padding:10px}
.opcard{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:12px 16px; margin-bottom:8px; position:relative; overflow:hidden;
}
.opcard.idle{border-color:var(--bad); background:linear-gradient(90deg,#2a1414,var(--panel) 40%)}
.opcard.idle::before{content:'';position:absolute;inset:0;border:2px solid var(--bad);border-radius:10px;animation:idlepulse 1.4s infinite;pointer-events:none}
@keyframes idlepulse{0%,100%{opacity:.35}50%{opacity:.9}}
.op-top{display:flex;align-items:center;gap:12px}
.op-name{font-family:var(--font);font-size:22px;letter-spacing:.5px;color:#fff}
.op-eff{margin-left:auto;display:flex;align-items:center;gap:8px}
.op-eff .badge{font-weight:800;font-size:15px;padding:3px 12px;border-radius:20px;color:#0a0a0a}
.badge.g{background:var(--ok)} .badge.w{background:var(--warn)} .badge.b{background:var(--bad);color:#fff} .badge.n{background:var(--steel);color:#cfd6dd}
.op-status{font-size:11px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:5px;text-transform:uppercase}
.op-status.curso{background:rgba(58,160,255,.18);color:var(--curso)}
.op-status.idle{background:rgba(231,76,60,.18);color:var(--bad)}
.task{margin-top:10px;background:var(--panel2);border-radius:8px;padding:10px 12px;border-left:4px solid var(--steel)}
.task.ok{border-left-color:var(--ok)} .task.ko{border-left-color:var(--bad)} .task.curso{border-left-color:var(--curso)} .task.nc{border-left-color:#a855f7}
.task .mo{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.task .wo{font-size:17px;font-weight:700;color:#fff;line-height:1.25;margin-top:2px}
.task .meta{display:flex;gap:14px;margin-top:8px;align-items:center;flex-wrap:wrap}
.task .chip{font-size:11px;font-weight:700;color:var(--muted)}
.task .chip b{color:#fff}
.bar{flex:1;min-width:80px;height:8px;background:#0f1318;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--amber)}
.idle-msg{margin-top:10px;background:rgba(231,76,60,.1);border:1px dashed var(--bad);border-radius:8px;padding:10px 12px;
  color:var(--bad);font-weight:800;font-size:14px;text-align:center;letter-spacing:.5px}
.empty{padding:40px;text-align:center;color:var(--muted);font-weight:700}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:rot 1s linear infinite;margin:80px auto}
@keyframes rot{to{transform:rotate(360deg)}}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65;display:none}
#shade.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:-100%;background:#1c2128;border-top:3px solid var(--amber);
  border-radius:16px 16px 0 0;padding:20px 22px 28px;z-index:70;transition:bottom .22s;box-shadow:0 -10px 30px rgba(0,0,0,.6);max-height:80vh;overflow-y:auto}
#sheet.on{bottom:0}
#sheet .x{position:absolute;top:10px;right:16px;font-size:24px;color:var(--muted);background:none;border:none}
#sheet h2{font-family:var(--font);font-size:24px;letter-spacing:.5px;margin-bottom:4px}
#sheet .m{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
#sheet .btns{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
#sheet .btns button{border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;text-align:left}
.vconf{background:#1e7e42} .vdist{background:#1d6fa5} .vnoconf{background:#a5321d}
#sheet select,#sheet input[type=text]{width:100%;border-radius:9px;border:1px solid var(--line);background:#12161b;color:var(--txt);padding:11px;font-size:14px;margin-bottom:8px}
#sheet select.warn{border:2px solid var(--bad)}
#sheet .stx{font-size:13px;font-weight:800;min-height:18px}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .ttl{font-size:24px} .clock .t{font-size:30px}
}
</style>
</head>
<body>
<div class="off" id="off">⚠ SIN CONEXIÓN — mostrando últimos datos</div>
<div class="hdr">
  <span class="logo"><img src="rental%20logo.png" onerror="this.parentNode.style.display='none'" alt="RENTAL"></span>
  <div class="ttl">HORA A HORA<small id="subt">CINZIA RENTAL · PLANTA</small></div>
  <div class="clock"><div class="t" id="reloj">--:--</div><div class="d" id="fechaTxt">cargando…</div></div>
  <button class="btn" onclick="diaAnterior()">◀ Día ant.</button>
  <button class="btn primary" id="btnHoy" style="display:none" onclick="diaHoy()">Hoy ▶</button>
  <button class="btn" onclick="cargar()">↻ Actualizar</button>
</div>

<div class="wrap" id="wrap">
  <div class="panel" id="panelBSAS">
    <div class="panel-hdr">
      <span class="suc-pill">BSAS</span>
      <span class="suc-count" id="cntBSAS">— operarios</span>
      <div class="gauge" id="gaugeBSAS"><div><div class="num">—</div><div class="lbl">Eficiencia</div></div></div>
    </div>
    <div class="rows" id="rowsBSAS"><div class="spin"></div></div>
  </div>
  <div class="panel" id="panelCBA">
    <div class="panel-hdr">
      <span class="suc-pill">CBA</span>
      <span class="suc-count" id="cntCBA">— operarios</span>
      <div class="gauge" id="gaugeCBA"><div><div class="num">—</div><div class="lbl">Eficiencia</div></div></div>
    </div>
    <div class="rows" id="rowsCBA"><div class="spin"></div></div>
  </div>
</div>

<div id="shade" onclick="cerrarDet()"></div>
<div id="sheet">
  <button class="x" onclick="cerrarDet()">✕</button>
  <h2 id="shT"></h2>
  <div class="m" id="shM"></div>
  <div id="shCtl"></div>
</div>

<script>
/* ================== CONFIG ==================
   Pegar acá la URL del Apps Script (deploy -> Web app -> URL /exec) */
var URL_BASE = 'https://script.google.com/macros/s/AKfycbwWHY-0FwOIy8vbiMt9c66OC_eDtagsQxvcIJtmCGJkho2nfbGMOsi41szG4OtHEVOU/exec';
var URL_API = URL_BASE + '?view=horaxhora';
var URL_EXEC = URL_BASE;

var CAUSALES = ['Búsqueda de material/pieza', 'Falta de atención del operario', 'Falta de herramienta', 'Complicación en desarme/armado'];
var VALS = [
  { code: 'CONFORME', label: '✔ Validada conforme', cls: 'vconf' },
  { code: 'A_DISTANCIA', label: '📡 Validada a distancia', cls: 'vdist' },
  { code: 'NO_CONFORME', label: '✘ Validada pero no conforme', cls: 'vnoconf' }
];

function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function effClass(v){ if(v==null) return 'n'; if(v>=90) return 'g'; if(v>=70) return 'w'; return 'b'; }

function cerrarDet(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('shade').classList.remove('on'); }
var CUR = null;

function abrirValidacion(t){
  CUR = t;
  document.getElementById('shT').textContent = t.wo;
  document.getElementById('shM').innerHTML = esc(t.mo) + ' · ' + esc(t.opn) + ' · ' + esc(t.ini) + '–' + esc(t.fin) +
    (t.obj ? (' · estándar ' + t.obj + 'm / real ' + Math.round(t.rmin) + 'm') : '');
  var ctl = document.getElementById('shCtl');
  var inef = t.obj > 0 && t.rmin > t.obj;
  var html = '<div class="btns">';
  VALS.forEach(function(v){ html += '<button class="'+v.cls+'" onclick="validar(\''+v.code+'\')">'+v.label+'</button>'; });
  html += '</div>';
  if (inef) {
    html += '<select id="shCz" class="warn"><option value="">⚠ Causal de ineficiencia (obligatorio)…</option>';
    CAUSALES.forEach(function(c){ html += '<option>'+c+'</option>'; });
    html += '</select>';
  }
  html += '<input type="text" id="shNota" placeholder="Nota (opcional)"><div class="stx" id="shSt"></div>';
  ctl.innerHTML = html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('shade').classList.add('on');
}

function validar(codigo){
  if(!CUR) return;
  var st = document.getElementById('shSt');
  var inef = CUR.obj > 0 && CUR.rmin > CUR.obj;
  var cz = document.getElementById('shCz');
  var causal = cz ? cz.value : '';
  if (inef && !causal) { st.textContent = '⚠ Elegí el causal de la ineficiencia'; st.style.color = 'var(--bad)'; return; }
  var payload = {
    tipo: 'validacion', mo: CUR.mof, operario: CUR.opn, wo: CUR.wof, obj_min: CUR.obj, real_min: CUR.rmin,
    validacion: codigo, nota: (document.getElementById('shNota')||{}).value || '', causal: causal
  };
  st.textContent = 'guardando…'; st.style.color = 'var(--muted)';
  fetch(URL_EXEC, { method:'POST', body:JSON.stringify(payload) }).then(function(r){ return r.text(); }).then(function(){
    st.textContent = '✓ Guardado'; st.style.color = 'var(--ok)';
    setTimeout(function(){ cerrarDet(); cargar(); }, 800);
  }).catch(function(e){ st.textContent = 'Error: ' + e; st.style.color = 'var(--bad)'; });
}

function renderOperario(o){
  var effCls = effClass(o.eficiencia);
  var tareaActual = o.real && o.real.length ? o.real[o.real.length - 1] : null;
  var h = '<div class="opcard' + (!o.enCurso ? ' idle' : '') + '">';
  h += '<div class="op-top"><span class="op-name">' + esc(o.nom) + '</span>';
  h += '<span class="op-status ' + (o.enCurso ? 'curso' : 'idle') + '">' + (o.enCurso ? '● En tarea' : '⚠ Sin tarea') + '</span>';
  h += '<span class="op-eff"><span class="badge ' + effCls + '">' + (o.eficiencia != null ? o.eficiencia + '%' : '—') + '</span></span></div>';

  if (tareaActual) {
    var t = tareaActual;
    var pct = t.avance_mo != null ? t.avance_mo : 0;
    h += '<div class="task ' + t.e + '" data-idx="' + (o.real.length - 1) + '" onclick="abrirValidacionByOp(this,\'' + o.nom.replace(/'/g,"\\'") + '\')">';
    h += '<div class="mo">' + esc(t.mo) + ' · ' + esc(t.ini) + (t.e === 'curso' ? '–ahora' : ('–' + esc(t.fin))) + '</div>';
    h += '<div class="wo">' + esc(t.wo) + '</div>';
    h += '<div class="meta">';
    h += '<span class="chip">Estándar <b>' + (t.obj || '—') + 'm</b></span>';
    h += '<span class="chip">Real <b>' + Math.round(t.rmin) + 'm</b></span>';
    if (t.avance_mo != null) {
      h += '<span class="chip">Avance orden <b>' + pct + '%</b></span>';
      h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    }
    h += '</div></div>';
  }
  if (!o.enCurso) {
    h += '<div class="idle-msg">OPERARIO SIN TAREA REGISTRADA EN ESTE MOMENTO</div>';
  }
  h += '</div>';
  return h;
}

var OPERARIOS_CACHE = {};
function abrirValidacionByOp(el, nomOp){
  var idx = +el.getAttribute('data-idx');
  var o = OPERARIOS_CACHE[nomOp];
  if (!o) return;
  abrirValidacion(o.real[idx]);
}

function render(D){
  document.getElementById('reloj').textContent = D.hora;
  document.getElementById('fechaTxt').textContent = (D.hist ? '📅 ' : '') + D.fecha + (D.hist ? ' · día cerrado' : ' · en vivo');
  document.getElementById('btnHoy').style.display = D.hist ? '' : 'none';

  OPERARIOS_CACHE = {};
  (D.operarios || []).forEach(function(o){ OPERARIOS_CACHE[o.nom] = o; });

  ['BSAS', 'CBA'].forEach(function(suc){
    var lst = (D.operarios || []).filter(function(o){ return o.suc === suc; });
    var rowsEl = document.getElementById('rows' + suc);
    rowsEl.innerHTML = lst.length ? lst.map(renderOperario).join('') : '<div class="empty">Sin operarios con registro hoy en ' + suc + '</div>';

    var sInfo = (D.sucursales || {})[suc];
    document.getElementById('cnt' + suc).textContent = (sInfo ? sInfo.operarios : lst.length) + ' operarios';
    var gEl = document.getElementById('gauge' + suc);
    var eff = sInfo ? sInfo.eficiencia : null;
    gEl.className = 'gauge ' + effClass(eff);
    gEl.innerHTML = '<div><div class="num">' + (eff != null ? eff + '%' : '—') + '</div><div class="lbl">Eficiencia</div></div>';
  });
}

var offsetDias = 0, HIST = false;
function fechaOffset(n){ var d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function diaAnterior(){ offsetDias++; cargar(); }
function diaHoy(){ offsetDias = 0; cargar(); }

function cargar(){
  var url = URL_API + (offsetDias > 0 ? ('&fecha=' + fechaOffset(offsetDias)) : '');
  fetch(url + '&t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(D){
    if (!D.ok) throw new Error(D.error || 'error');
    document.getElementById('off').style.display = 'none';
    try { localStorage.setItem('hxh_last', JSON.stringify(D)); } catch(e){}
    render(D);
  }).catch(function(e){
    document.getElementById('off').style.display = 'block';
    try { var u = localStorage.getItem('hxh_last'); if (u) render(JSON.parse(u)); } catch(e2){}
  });
}

cargar();
setInterval(cargar, 60000);
setInterval(function(){
  var now = new Date();
  document.getElementById('reloj').textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}, 15000);
</script>
</body>
</html>
