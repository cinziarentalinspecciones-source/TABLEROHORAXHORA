<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinzia Rental · Hora a Hora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1318; --panel:#171d25; --panel2:#1e2630; --line:#2f3946; --steel:#465468; --amber:#f5a524;
  --verde:#22c55e; --amarillo:#facc15; --rojo:#ef4444;
  --txt:#f4f6f8; --muted:#9aa8b8; --cur:#38bdf8;
  --font:'Oswald','Arial Narrow',sans-serif; --fb:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --colL:18.5vw; --colR:31vw; --pad:1.1vw;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ===== HEADER ===== */
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:1.4vw;padding:.7vh 1.5vw;background:linear-gradient(180deg,#1a222b,#10151a);border-bottom:.5vh solid var(--amber);position:relative;z-index:20}
.hdr::before{content:'';position:absolute;left:0;right:0;bottom:-.5vh;height:.5vh;background:repeating-linear-gradient(90deg,#000 0 2vw,var(--amber) 2vw 4vw)}
.logo{background:#fff;border-radius:.6vh;padding:.4vh .8vw;display:flex;align-items:center;height:4.2vh}
.logo img{height:3.1vh;display:block}
.ttl{font-family:var(--font);font-weight:700;font-size:3.5vh;letter-spacing:.1vw;line-height:1}
.ttl small{display:block;font-family:var(--fb);font-size:1.3vh;letter-spacing:.15vw;color:var(--muted);font-weight:600;margin-top:.4vh}
.legend{display:flex;gap:1vw;font-size:1.5vh;font-weight:700;color:var(--muted);margin-left:1vw}
.legend span{display:flex;align-items:center;gap:.4vw;white-space:nowrap}
.legend i{width:1.8vh;height:1.8vh;border-radius:.3vh;border:1px solid #fff;display:inline-block}
.clock{margin-left:auto;text-align:right}
.clock .t{font-family:var(--font);font-weight:700;font-size:4.4vh;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-size:1.4vh;color:var(--muted);text-transform:uppercase;letter-spacing:.08vw}
.btn{background:#27313d;border:1px solid var(--line);color:var(--txt);border-radius:.8vh;padding:.9vh 1vw;font-weight:700;font-size:1.6vh;cursor:pointer;font-family:var(--fb)}
.btn:hover{background:#323e4c}
.btn.on{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.seg{display:flex;gap:.3vw}
.off{position:fixed;top:0;left:0;right:0;background:var(--rojo);color:#fff;text-align:center;font-weight:800;padding:.8vh;z-index:100;display:none;font-size:1.8vh}
.sndbar{position:fixed;bottom:1vh;left:50%;transform:translateX(-50%);background:#1d4ed8;color:#fff;padding:1vh 2vw;font-weight:800;font-size:1.8vh;border-radius:1vh;z-index:90;display:none;cursor:pointer}

/* ===== SECCIONES ===== */
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:.3vh;background:var(--line);overflow-y:auto}
.sec{background:var(--bg);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#secBSAS{flex:2 1 auto} #secCBA{flex:3 1 auto}
body[data-f="BSAS"] #secCBA, body[data-f="CBA"] #secBSAS{display:none}
.sec-hdr{flex:0 0 auto;display:flex;align-items:center;gap:1.2vw;padding:.4vh var(--pad);background:linear-gradient(90deg,#1d252f,#141a20);border-bottom:1px solid var(--steel)}
.pill{font-family:var(--font);font-weight:700;font-size:2.8vh;letter-spacing:.12vw;background:var(--steel);padding:.1vh 1.1vw;border-radius:.7vh;border-left:.6vh solid var(--amber)}
.sec-sub{font-size:1.5vh;color:var(--muted);font-weight:600}
.gauges{margin-left:auto;display:flex;gap:2.5vw}
.gauge{display:flex;align-items:center;gap:.7vw}
.gauge .num{font-family:var(--font);font-weight:700;font-size:4vh;line-height:1;font-variant-numeric:tabular-nums}
.gauge .lbl{font-size:1.3vh;color:var(--muted);text-transform:uppercase;letter-spacing:.05vw;font-weight:700;line-height:1.15}
.gauge.g .num{color:var(--verde)} .gauge.w .num{color:var(--amarillo)} .gauge.b .num{color:var(--rojo)} .gauge.n .num{color:var(--muted)}

.ruler,.oprow{display:grid;grid-template-columns:var(--colL) 1fr var(--colR);column-gap:var(--pad);padding:0 var(--pad)}
.ruler{flex:0 0 auto;background:#131920;border-bottom:1px solid var(--steel);font-size:1.5vh;font-weight:700;color:var(--muted)}
.ruler .hrs{display:flex}
.ruler .hrs span{flex:1;padding:.3vh 0 .3vh .3vw;border-left:1px solid var(--steel);font-variant-numeric:tabular-nums}

.rows{flex:1;min-height:0;display:flex;flex-direction:column}
.oprow{flex:1 1 0;min-height:14vh;align-items:stretch;border-bottom:1px solid #1f2933;padding-top:.6vh;padding-bottom:.6vh;position:relative;overflow:hidden}
.oprow.alarma{animation:rowflash 1s infinite}
@keyframes rowflash{0%,100%{background:rgba(239,68,68,.12)}50%{background:rgba(255,255,255,.22)}}
.oprow.sinreg{background:rgba(239,68,68,.10)}

/* --- columna izquierda --- */
.c-op{display:flex;flex-direction:column;justify-content:center;gap:.5vh;min-width:0}
.op-name{font-family:var(--font);font-weight:600;font-size:3vh;line-height:1.05;letter-spacing:.03vw;white-space:nowrap}
.op-tag{font-size:1.2vh;font-weight:800;color:#1a1200;background:var(--amber);padding:.1vh .4vw;border-radius:.4vh;margin-left:.4vw;vertical-align:middle;font-family:var(--fb)}
.op-row{display:flex;align-items:center;justify-content:space-between;gap:.5vw}
.op-st{display:inline-block;font-size:1.4vh;font-weight:800;letter-spacing:.04vw;padding:.3vh .6vw;border-radius:.5vh;text-transform:uppercase;white-space:nowrap}
.op-st.curso{background:rgba(56,189,248,.18);color:var(--cur)}
.op-st.idle{background:rgba(239,68,68,.22);color:#ff8f86}
.op-eff{display:flex;align-items:baseline;gap:.4vw;white-space:nowrap}
.op-eff b{font-family:var(--font);font-weight:700;font-size:4.2vh;line-height:1;font-variant-numeric:tabular-nums}
.op-eff span{font-size:1.2vh;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04vw}
.op-eff.g b{color:var(--verde)} .op-eff.w b{color:var(--amarillo)} .op-eff.b b{color:var(--rojo)} .op-eff.n b{color:var(--muted)}
.occ{display:flex;align-items:center;gap:.6vw}
.occ .lbl{font-size:1.25vh;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03vw;white-space:nowrap}
.occ .trk{flex:1;height:.9vh;background:#0a0d10;border-radius:.5vh;overflow:hidden}
.occ .trk i{display:block;height:100%;background:var(--amber)}

/* --- columna central --- */
.c-mid{display:flex;flex-direction:column;gap:.7vh;min-width:0}
.tl{position:relative;flex:1 1 0;min-height:4.5vh;background:#0a0e12;border-radius:.7vh;overflow:hidden}
.tl .hl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.09)}
.tl .lunch{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 .6vh,rgba(148,163,184,.14) .6vh 1.2vh);color:#64748b;font-size:1.3vh;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:.1vw}
.blk{position:absolute;top:.5vh;bottom:.5vh;border-radius:.5vh;border:1px solid rgba(255,255,255,.92);cursor:pointer;overflow:hidden;padding:.2vh .35vw;display:flex;flex-direction:column;justify-content:center;min-width:.5vw;line-height:1.15}
.blk b{font-size:1.75vh;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-transform:none}
.blk i{font-style:normal;font-size:1.55vh;font-weight:700;white-space:nowrap;opacity:.95;font-variant-numeric:tabular-nums}
.blk.l0{top:.4vh;bottom:calc(50% + .15vh)} .blk.l1{top:calc(50% + .15vh);bottom:.4vh}
.blk.dos{flex-direction:row;align-items:center;gap:.4vw;padding:0 .3vw}
.blk.dos b{-webkit-line-clamp:1;font-size:1.5vh}
.blk.dos i{font-size:1.4vh}
.gap{position:absolute;top:.4vh;bottom:.4vh;border-radius:.4vh;border:1px dashed rgba(239,68,68,.75);background:repeating-linear-gradient(-45deg,rgba(239,68,68,.20) 0 .7vh,rgba(239,68,68,.05) .7vh 1.4vh);color:#ff8f86;font-size:1.35vh;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:.03vw;overflow:hidden;white-space:nowrap;line-height:1.1}
.gap.gran{border-color:var(--rojo);background:repeating-linear-gradient(-45deg,rgba(239,68,68,.38) 0 .7vh,rgba(239,68,68,.10) .7vh 1.4vh);color:#fff}
.blk.verde{background:linear-gradient(180deg,#2fd06a,#16a34a);color:#04210f}
.blk.amarillo{background:linear-gradient(180deg,#fde047,#eab308);color:#2b2200}
.blk.rojo{background:linear-gradient(180deg,#f2645a,#c62d22);color:#fff}
.blk.curso::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep 2s infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.blk.validada::before{content:'✓';position:absolute;top:0;right:.2vw;font-size:1.8vh;font-weight:900;color:#fff;text-shadow:0 0 3px #000;z-index:2}
.tl .now{position:absolute;top:0;bottom:0;width:.25vw;background:#fff;z-index:6;box-shadow:0 0 6px #fff}
.tl .now::before{content:'AHORA';position:absolute;top:0;left:.3vw;font-size:1.2vh;font-weight:800;background:#fff;color:#111;padding:0 .3vw;border-radius:.3vh}

.ords{display:flex;flex-wrap:wrap;gap:.5vh .5vw;flex:0 0 auto;overflow:hidden;max-height:7.6vh}
.ord{position:relative;display:flex;align-items:center;gap:.45vw;background:#151b22;border:1px solid var(--line);border-radius:.8vh;padding:.3vh .5vw;font-size:1.7vh;font-weight:700;overflow:hidden;flex:0 1 auto;min-width:0;white-space:nowrap}
.ord .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(245,165,36,.30)}
.ord.act{border-color:var(--amber)}
.ord .n{position:relative;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ord .c{position:relative;color:#fff;flex:none}
.ord .p{position:relative;flex:none;font-family:var(--font);font-size:2.1vh;color:var(--amber);font-variant-numeric:tabular-nums}
.ord .lb{position:relative;font-size:1.3vh;color:var(--muted);letter-spacing:.03vw}
.ords.many .lb{display:none}

/* --- columna derecha: tarea actual --- */
.c-cur{min-width:0;display:flex}
.cur{flex:1;background:var(--panel2);border-radius:.9vh;border-left:.7vh solid var(--steel);padding:.8vh .8vw;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:center;gap:.4vh;overflow:hidden}
.cur.verde{border-left-color:var(--verde)} .cur.amarillo{border-left-color:var(--amarillo)} .cur.rojo{border-left-color:var(--rojo)}
.cur .k{font-size:1.35vh;color:var(--muted);font-weight:800;letter-spacing:.04vw;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur .nm{font-size:2.5vh;font-weight:800;line-height:1.1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cur .tm{display:flex;align-items:center;gap:.7vw;flex-wrap:nowrap;white-space:nowrap;font-size:1.7vh;font-weight:700;color:var(--muted)}
.cur .tm b{font-family:var(--font);font-size:2.4vh;color:#fff;font-variant-numeric:tabular-nums}
.cur .tm .ov{padding:.1vh .6vw;border-radius:.5vh;font-weight:800;color:#111}
.cur .tm .ov.verde{background:var(--verde)} .cur .tm .ov.amarillo{background:var(--amarillo)} .cur .tm .ov.rojo{background:var(--rojo);color:#fff}
.cur .vb{position:absolute;top:.5vh;right:.6vw;background:var(--verde);color:#04210f;font-size:1.3vh;font-weight:800;padding:.1vh .6vw;border-radius:1vh}
.alrm{flex:1;border-radius:.9vh;border:.4vh solid var(--rojo);background:#fff;color:#7f1d1d;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;animation:alrmflash 1s infinite;padding:.5vh}
.alrm.silent{animation:none;background:rgba(239,68,68,.12);color:#ff8f86}
@keyframes alrmflash{0%,100%{box-shadow:0 0 0 .3vh var(--rojo),0 0 .8vh rgba(255,255,255,.6)}50%{box-shadow:0 0 0 .5vh #fde047,0 0 2.2vh rgba(255,255,255,1)}}
.alrm b{font-family:var(--font);font-size:3.6vh;line-height:1.05}
.alrm span{font-size:1.7vh;font-weight:800;margin-top:.3vh}
.ackok{position:absolute;bottom:.4vh;right:.6vw;font-size:1.3vh;font-weight:800;color:var(--verde)}

.oprow.ausente{background:rgba(148,163,184,.06)}
.oprow.ausente .op-name{color:#94a3b8}
.op-st.aus{background:rgba(148,163,184,.22);color:#cbd5e1}
.aus-msg{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:600;font-size:3.6vh;letter-spacing:.25vw;color:#94a3b8;background:repeating-linear-gradient(45deg,rgba(148,163,184,.09) 0 1vh,transparent 1vh 2vh)}
.aus-card{flex:1;border-radius:.9vh;border:.3vh solid #64748b;background:#18202a;color:#e2e8f0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:.5vh}
.aus-card b{font-family:var(--font);font-size:3.6vh;line-height:1.05;letter-spacing:.08vw}
.aus-card span{font-size:1.7vh;font-weight:700;margin-top:.4vh;color:#94a3b8}
.empty{padding:4vh;text-align:center;color:var(--muted);font-weight:700;font-size:2vh}
.estado-carga{text-align:center;color:var(--muted);font-weight:700;font-size:2.2vh;padding:0 2vw}
.spin{width:5vh;height:5vh;border:.5vh solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:rot 1s linear infinite;margin:6vh auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== MODAL ===== */
#shade{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:65;display:none}
#shade.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:-100%;background:#1c2128;border-top:.5vh solid var(--amber);border-radius:2vh 2vh 0 0;padding:2.5vh 2vw 3vh;z-index:70;transition:bottom .22s;box-shadow:0 -1vh 4vh rgba(0,0,0,.6);max-height:85vh;overflow-y:auto}
#sheet.on{bottom:0}
#sheet .x{position:absolute;top:1vh;right:1.5vw;font-size:3.5vh;color:var(--muted);background:none;border:none;cursor:pointer}
#sheet h2{font-family:var(--font);font-weight:700;font-size:3.2vh;margin-bottom:.6vh;padding-right:4vw}
#sheet .m{font-size:1.9vh;color:var(--muted);line-height:1.5;margin-bottom:1.6vh}
#sheet .btns{display:flex;flex-direction:column;gap:1.2vh;margin-bottom:1.2vh}
#sheet .btns button{border:none;border-radius:1.2vh;padding:1.8vh 1.5vw;font-size:2.2vh;font-weight:800;color:#fff;cursor:pointer;text-align:left;font-family:var(--fb)}
.vconf{background:#1e7e42}.vdist{background:#1d6fa5}.vnoconf{background:#a5321d}.vgap{background:#2563eb}
#sheet select,#sheet input[type=text]{width:100%;border-radius:1vh;border:1px solid var(--line);background:#12161b;color:var(--txt);padding:1.4vh 1vw;font-size:2vh;margin-bottom:1vh;font-family:var(--fb)}
#sheet select.warn{border:.3vh solid var(--rojo)}
#sheet .stx{font-size:1.9vh;font-weight:800;min-height:2.4vh}
#sheet .yaval{background:rgba(34,197,94,.12);border:1px solid var(--verde);border-radius:1vh;padding:1.4vh 1vw;color:var(--verde);font-weight:700;font-size:2vh}

/* ===== INFORME DEL DÍA ===== */
#informe{position:fixed;top:0;left:0;right:0;bottom:0;background:#0b0e12;z-index:80;display:none;flex-direction:column;overflow:hidden;font-family:var(--fb)}
#informe.on{display:flex}
.inf-hdr{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:14px 22px;background:linear-gradient(180deg,#1a222b,#10151a);border-bottom:3px solid var(--amber)}
.inf-hdr h1{font-family:var(--font);font-weight:700;font-size:24px;color:#fff}
.inf-hdr .sub{font-size:13px;color:var(--muted);font-weight:600}
.inf-seg{display:flex;gap:6px;margin-left:auto}
.inf-btn{background:#27313d;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--fb)}
.inf-btn:hover{background:#323e4c}
.inf-btn.on{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.inf-btn.primary{background:#1d6fa5;border-color:#1d6fa5;color:#fff}
#informe-body{flex:1;overflow-y:auto;padding:22px 28px;color:#e6eaee}
.inf-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.inf-card{background:#171d25;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.inf-card .n{font-family:var(--font);font-weight:700;font-size:32px;line-height:1}
.inf-card .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
.inf-card.g .n{color:var(--verde)} .inf-card.w .n{color:var(--amarillo)} .inf-card.b .n{color:var(--rojo)} .inf-card.n .n{color:var(--muted)}
.inf-sec-title{font-family:var(--font);font-weight:700;font-size:19px;color:#fff;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--steel)}
.inf-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.inf-table th{text-align:left;color:var(--muted);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.4px;padding:6px 10px;border-bottom:1px solid var(--steel)}
.inf-table td{padding:7px 10px;border-bottom:1px solid #1f2933;vertical-align:top}
.inf-table tr:hover td{background:#171d25}
.inf-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.inf-dot.verde{background:var(--verde)} .inf-dot.amarillo{background:var(--amarillo)} .inf-dot.rojo{background:var(--rojo)}
.inf-pill{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.inf-pill.ok{background:rgba(34,197,94,.18);color:var(--verde)}
.inf-pill.no{background:rgba(239,68,68,.18);color:#ff8f86}
.inf-empty{color:var(--muted);font-size:13px;padding:10px 0}
.inf-graveRow td{background:rgba(239,68,68,.06)}
@media print{
  body *{visibility:hidden}
  #informe, #informe *{visibility:visible}
  #informe{position:static;background:#fff;color:#111}
  .inf-hdr .inf-seg{display:none}
  #informe-body{color:#111;overflow:visible}
  .inf-card{background:#f3f4f6;border-color:#ccc}
  .inf-table th{color:#555;border-color:#999}
  .inf-table td{border-color:#ddd;color:#111}
  .inf-sec-title{color:#111;border-color:#999}
}
</style>
</head>
<body data-f="TODAS">
<div class="off" id="off"></div>
<div class="sndbar" id="sndbar" onclick="ensureAudio();actualizarAlarmas()">🔔 Tocá la pantalla para activar el sonido de las alarmas</div>

<div class="hdr">
  <span class="logo"><img src="rental%20logo.png" onerror="this.parentNode.style.display='none'" alt="RENTAL"></span>
  <div class="ttl">HORA A HORA<small>CINZIA RENTAL · PLANTA</small></div>
  <div class="legend">
    <span><i style="background:var(--verde)"></i>En tiempo</span>
    <span><i style="background:var(--amarillo)"></i>Hasta +15 min</span>
    <span><i style="background:var(--rojo)"></i>Más de +15 min</span>
  </div>
  <div class="clock"><div class="t" id="reloj">--:--</div><div class="d" id="fechaTxt">cargando…</div></div>
  <div class="seg">
    <button class="btn on" data-f="TODAS" onclick="setFiltro('TODAS')">Todas</button>
    <button class="btn" data-f="BSAS" onclick="setFiltro('BSAS')">BSAS</button>
    <button class="btn" data-f="CBA" onclick="setFiltro('CBA')">CBA</button>
  </div>
  <div class="seg">
    <button class="btn" onclick="diaAnterior()">◀ Día ant.</button>
    <button class="btn on" id="btnHoy" style="display:none" onclick="diaHoy()">Hoy ▶</button>
    <button class="btn" onclick="cargar(true)">↻</button>
    <button class="btn" onclick="abrirInforme()">📋 Informe</button>
    <button class="btn" onclick="pantallaCompleta()">⛶ Pantalla completa</button>
  </div>
</div>

<div id="informe">

  <button class="x" onclick="cerrarDet()">✕</button>
  <h2 id="shT"></h2>
  <div class="m" id="shM"></div>
  <div id="shCtl"></div>
</div>

<script>
/* ================== CONFIG ================== */
var URL_BASE = 'https://script.google.com/macros/s/AKfycbwWHY-0FwOIy8vbiMt9c66OC_eDtagsQxvcIJtmCGJkho2nfbGMOsi41szG4OtHEVOU/exec';
var URL_API = URL_BASE + '?view=horaxhora';
var URL_VAL = URL_BASE + '?view=validaciones';
var GAP_MIN = 15;          // minutos sin tarea para disparar la alarma

var CAUSALES = ['Búsqueda de material/pieza', 'Falta de atención del operario', 'Falta de herramienta', 'Complicación en desarme/armado'];
var VALS = [
  { code: 'CONFORME', label: '✔ Validada conforme', cls: 'vconf' },
  { code: 'A_DISTANCIA', label: '📡 Validada a distancia', cls: 'vdist' },
  { code: 'NO_CONFORME', label: '✘ Validada pero no conforme', cls: 'vnoconf' }
];
var ACCIONES = [
  { code: 'Aviso a supervisor', label: '📣 Aviso a supervisor' },
  { code: 'Cargué la tarea', label: '📝 Cargué la tarea' },
  { code: 'Aviso a operador', label: '🗣 Aviso a operador' }
];

/* ================== UTILIDADES ================== */
function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function fmtM(m){ m=Math.round(m); if(m<60) return m+'m'; var h=Math.floor(m/60), r=m%60; return h+'h'+(r<10?'0':'')+r; }
function hhmm(min){ var h=Math.floor(min/60), m=Math.round(min%60); return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function toMin(s){ if(!s) return null; var p=s.split(':'); return (+p[0])*60+(+p[1]); }
function effClass(v){ if(v==null) return 'n'; if(v>=85) return 'g'; if(v>=60) return 'w'; return 'b'; }
function jornadaMin(a,b,segs){ var t=0; segs.forEach(function(s){ var x=Math.max(a,s[0]), y=Math.min(b,s[1]); if(y>x) t+=y-x; }); return t; }
function pct(min,D){ return Math.max(0,Math.min(100,(min-D.iniDia)/(D.finDia-D.iniDia)*100)); }

// JSONP con tiempo límite: si el servidor no responde avisa en vez de esperar para siempre
function jsonp_(url,onData,onError){
  var cb='jsonp_cb_'+(new Date().getTime())+'_'+Math.floor(Math.random()*1e6);
  var sc=document.createElement('script');
  var terminado=false, timer=null;
  var limpiar=function(){ terminado=true; if(timer) clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(sc.parentNode) sc.parentNode.removeChild(sc); };
  window[cb]=function(d){ if(terminado) return; limpiar(); onData(d); };
  sc.onerror=function(){ if(terminado) return; limpiar(); onError(new Error('sin respuesta del servidor')); };
  timer=setTimeout(function(){ if(terminado) return; limpiar(); onError(new Error('el servidor tardó más de 60 s en responder')); }, 60000);
  sc.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb;
  document.body.appendChild(sc);
}

// cualquier error de JavaScript se muestra en pantalla (el TV no tiene consola)
window.onerror=function(msg,src,line){
  try{
    var el=document.getElementById('off');
    if(el){ el.textContent='⚠ ERROR EN LA PANTALLA: '+msg+' (línea '+line+')'; el.style.display='block'; }
    var st=document.getElementById('estadoCarga'); if(st) st.textContent='Error: '+msg;
  }catch(e){}
};
function estadoCarga(t){ var st=document.getElementById('estadoCarga'); if(st) st.textContent=t; }

/* ================== FILTRO ================== */
var FILTRO = 'TODAS';
(function(){
  var m = location.search.match(/[?&]sucursal=([A-Za-z]+)/);
  var v = m ? m[1].toUpperCase() : null;
  if(!v){ try{ v = localStorage.getItem('hxh_filtro'); }catch(e){} }
  if(v==='BSAS'||v==='CBA'||v==='TODAS') FILTRO=v;
})();
function setFiltro(f){
  FILTRO=f;
  try{ localStorage.setItem('hxh_filtro',f); }catch(e){}
  aplicarFiltro();
}
function aplicarFiltro(){
  document.body.setAttribute('data-f',FILTRO);
  Array.prototype.forEach.call(document.querySelectorAll('.seg [data-f]'), function(b){
    if(b.getAttribute('data-f')===FILTRO) b.classList.add('on'); else b.classList.remove('on');
  });
}

/* ================== AUDIO ================== */
var actx=null, alarmTimer=null;
function ensureAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){
  if(!actx||actx.state!=='running') return;
  try{
    var t0=actx.currentTime;
    var comp=actx.createDynamicsCompressor(); comp.connect(actx.destination);
    var tonos=[1000,1500,1000,1500,1000,1500];
    tonos.forEach(function(f,i){
      var t=t0+i*0.22;
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='square'; o.frequency.value=f; o.connect(g); g.connect(comp);
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(1.0,t+0.01); g.gain.setValueAtTime(1.0,t+0.19); g.gain.linearRampToValueAtTime(0.0001,t+0.21);
      o.start(t); o.stop(t+0.22);
    });
  }catch(e){}
}
document.addEventListener('click', ensureAudio);
document.addEventListener('keydown', ensureAudio);

/* ================== ESTADO ================== */
var REG = [];                 // bloques clickeables
var VALIDACIONES_HOY = {};    // wof -> validación
var ACKS = {};                // clave alarma -> acción
try{ ACKS = JSON.parse(localStorage.getItem('hxh_acks')||'{}'); }catch(e){}
var ULTIMO = null;
var ALARMAS = [];             // alarmas sin reconocer (para sonido)

/* ================== MODAL ================== */
function cerrarDet(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('shade').classList.remove('on'); }
function abrirSheet(){ document.getElementById('sheet').classList.add('on'); document.getElementById('shade').classList.add('on'); }
var CUR = null;

function abrirVal(i){ abrirValidacion(REG[i]); }

function abrirValidacion(t){
  if(!t) return;
  CUR = t;
  document.getElementById('shT').textContent = t.wo;
  document.getElementById('shM').innerHTML = esc(t.mo) + ' · ' + esc(t.opn) + ' · ' + esc(t.ini) + '–' + esc(t.fin) +
    (t.obj ? (' · estándar ' + fmtM(t.obj) + ' / real ' + fmtM(t.rmin)) : ' · real ' + fmtM(t.rmin));
  var ctl = document.getElementById('shCtl');
  var yaVal = VALIDACIONES_HOY[String(t.wof)];
  if (yaVal) {
    ctl.innerHTML = '<div class="yaval">✓ Ya validada: ' + esc(yaVal.validacion) + (yaVal.causal ? (' · ' + esc(yaVal.causal)) : '') + '</div>';
    abrirSheet(); return;
  }
  var inef = t.estado !== 'verde';
  var html = '<div class="btns">';
  VALS.forEach(function(v){ html += '<button class="'+v.cls+'" onclick="validar(\''+v.code+'\')">'+v.label+'</button>'; });
  html += '</div>';
  if (inef) {
    html += '<select id="shCz" class="warn"><option value="">⚠ Causal de ineficiencia (obligatorio)…</option>';
    CAUSALES.forEach(function(c){ html += '<option>'+c+'</option>'; });
    html += '</select>';
  }
  html += '<input type="text" id="shNota" placeholder="Nota (opcional)"><div class="stx" id="shSt"></div>';
  ctl.innerHTML = html;
  abrirSheet();
}

function validar(codigo){
  if(!CUR) return;
  var st = document.getElementById('shSt');
  var inef = CUR.estado !== 'verde';
  var cz = document.getElementById('shCz');
  var causal = cz ? cz.value : '';
  if (inef && !causal) { st.textContent = '⚠ Elegí el causal de la ineficiencia'; st.style.color = 'var(--rojo)'; return; }
  var payload = { tipo:'validacion', mo:CUR.mo, operario:CUR.opn, wo:CUR.wo, wof:CUR.wof, obj_min:CUR.obj, real_min:Math.round(CUR.rmin),
    validacion:codigo, nota:(document.getElementById('shNota')||{}).value||'', causal:causal };
  st.textContent = 'guardando…'; st.style.color = 'var(--muted)';
  fetch(URL_BASE, { method:'POST', mode:'no-cors', body:JSON.stringify(payload) }).then(function(){
    st.textContent = '✓ Guardado'; st.style.color = 'var(--verde)';
    VALIDACIONES_HOY[String(CUR.wof)] = { validacion:codigo, causal:causal };
    setTimeout(function(){ cerrarDet(); if(ULTIMO) render(ULTIMO); }, 600);
    setTimeout(function(){ cargar(true); }, 1500);
  }).catch(function(e){ st.textContent = 'Error: ' + e; st.style.color = 'var(--rojo)'; });
}

/* ---- alarma: operario presente sin tarea ---- */
var ALR = null;
function abrirAlarma(clave){
  ALR = ALARMAS_INFO[clave]; if(!ALR) return;
  document.getElementById('shT').textContent = '⚠ ' + ALR.nom + ' · sin tarea';
  document.getElementById('shM').innerHTML = ALR.sinReg
    ? 'No hay <b>ningún registro</b> hoy desde las ' + hhmm(ALR.desde) + '. Elegí qué acción tomaste:'
    : '<b>' + ALR.min + ' minutos</b> sin tarea (desde las ' + hhmm(ALR.desde) + '). Elegí qué acción tomaste para silenciar la alarma:';
  var html = '<div class="btns">';
  ACCIONES.forEach(function(a,i){ html += '<button class="vgap" onclick="ackAlarma(\''+clave.replace(/'/g,"\\'")+'\','+i+')">'+a.label+'</button>'; });
  html += '</div><div class="stx" id="shSt"></div>';
  document.getElementById('shCtl').innerHTML = html;
  abrirSheet();
}
function ackAlarma(clave,i){
  var info = ALARMAS_INFO[clave]; var accion = ACCIONES[i].code;
  ACKS[clave] = { accion:accion, ts:Date.now() };
  try{ localStorage.setItem('hxh_acks', JSON.stringify(ACKS)); }catch(e){}
  try{ fetch(URL_BASE, { method:'POST', mode:'no-cors', body:JSON.stringify({ tipo:'gap_ack', operario:info.nom, desde:hhmm(info.desde), minutos:info.min, accion:accion }) }); }catch(e){}
  cerrarDet();
  if(ULTIMO) render(ULTIMO);
}

var ALARMAS_INFO = {};
function calcAlarma(o,D){
  if(D.hist || o.sinUsuario || o.ausente || o.presenteAhora===false) return null;
  var ahora = D.nowMin, segs = o.jornada || D.jornada;
  if(!segs.length) return null;
  var dentro = segs.some(function(s){ return ahora>=s[0] && ahora<s[1]; });
  if(!dentro || o.enCurso) return null;
  var ultimo = null; o.sesiones.forEach(function(s){ if(ultimo==null || s[1]>ultimo) ultimo=s[1]; });
  var sinReg = (ultimo==null);
  var desde = sinReg ? segs[0][0]+10 : ultimo;
  var min = jornadaMin(desde, ahora, segs);
  if(min < GAP_MIN) return null;
  var clave = D.fecha+'|'+o.nom+'|'+desde;
  return { clave:clave, nom:o.nom, min:min, desde:desde, sinReg:sinReg, ack:ACKS[clave]||null };
}

function actualizarAlarmas(){
  var bar = document.getElementById('sndbar');
  if(ALARMAS.length>0){
    if(!alarmTimer){ alarmTimer=setInterval(function(){ ensureAudio(); beep(); },2000); ensureAudio(); beep(); }
    bar.style.display = (actx && actx.state==='running') ? 'none' : 'block';
  } else {
    if(alarmTimer){ clearInterval(alarmTimer); alarmTimer=null; }
    bar.style.display='none';
  }
}

/* ================== RENDER ================== */
function bloqueHTML(o,b,D,lane,dos){
  var left=pct(b.iniMin,D), right=pct(b.finMin,D), w=Math.max(right-left,0.5);
  var i = REG.push({ wof:b.wof, wo:b.tarea, mo:b.moLabel, opn:o.nom, ini:b.ini, fin:b.curso?'ahora':b.fin, obj:b.obj, rmin:b.real, estado:b.estado, curso:b.curso }) - 1;
  var txt='';
  if(w>13) txt='<b>'+esc(b.tarea)+'</b><i>'+fmtM(b.real)+(dos?'':' / '+(b.obj?fmtM(b.obj):'—'))+'</i>';
  else if(w>5) txt='<i>'+fmtM(b.real)+'</i>';
  var cls='blk '+b.estado+(b.curso?' curso':'')+(VALIDACIONES_HOY[String(b.wof)]?' validada':'')+(dos?(' dos l'+lane):'');
  return '<div class="'+cls+'" style="left:'+left+'%;width:'+w+'%" title="'+esc(b.tarea)+' · '+esc(b.ini)+'–'+esc(b.curso?'ahora':b.fin)+' · real '+fmtM(b.real)+' / estándar '+(b.obj?fmtM(b.obj):'—')+'" onclick="abrirVal('+i+')">'+txt+'</div>';
}

function timelineHTML(o,D){
  var n=(D.finDia-D.iniDia)/60, h='<div class="tl">';
  for(var k=0;k<n;k++) h+='<div class="hl" style="left:'+(k/n*100)+'%"></div>';
  D.jornada.forEach(function(s,idx){
    if(idx>0){ var a=pct(D.jornada[idx-1][1],D), b=pct(s[0],D); h+='<div class="lunch" style="left:'+a+'%;width:'+(b-a)+'%">ALMUERZO</div>'; }
  });
  // huecos SIN tarea (rayado rojo)
  (o.huecos||[]).forEach(function(g){
    var a=pct(g[0],D), z=pct(g[1],D), w=z-a, min=g[1]-g[0];
    var t = w>10 ? 'SIN TAREA '+fmtM(min) : (w>4 ? fmtM(min) : '');
    h+='<div class="gap'+(min>=GAP_MIN?' gran':'')+'" style="left:'+a+'%;width:'+w+'%" title="Sin tarea de '+hhmm(g[0])+' a '+hhmm(g[1])+' ('+fmtM(min)+')">'+t+'</div>';
  });
  // tareas: si dos se pisan en el tiempo, van en dos carriles
  var bl=o.bloques.slice().sort(function(a,b){ return a.iniMin-b.iniMin; });
  var finLane=[-1,-1], lanes=[], dos=false;
  bl.forEach(function(b){
    var l = finLane[0]<=b.iniMin ? 0 : 1;
    if(l===1) dos=true;
    finLane[l]=Math.max(finLane[l], b.finMin); lanes.push(l);
  });
  bl.forEach(function(b,k){ h+=bloqueHTML(o,b,D,lanes[k],dos); });
  if(!D.hist) h+='<div class="now" style="left:'+pct(D.nowMin,D)+'%"></div>';
  return h+'</div>';
}

function ocupacion(o,D){
  var elapsed=jornadaMin(0,D.nowMin,D.jornada); if(elapsed<=0) return 0;
  var iv=o.sesiones.slice().sort(function(a,b){return a[0]-b[0];}), merged=[];
  iv.forEach(function(s){ var l=merged[merged.length-1]; if(l && s[0]<=l[1]) l[1]=Math.max(l[1],s[1]); else merged.push([s[0],s[1]]); });
  var busy=0; merged.forEach(function(s){ busy+=jornadaMin(s[0],s[1],D.jornada); });
  return Math.min(100,Math.round(busy*100/elapsed));
}

function ausenteHTML(o,D){
  var n=(D.finDia-D.iniDia)/60, tl='<div class="tl">';
  for(var k=0;k<n;k++) tl+='<div class="hl" style="left:'+(k/n*100)+'%"></div>';
  tl+='<div class="aus-msg">AUSENTE</div></div>';
  var h='<div class="oprow ausente">';
  h+='<div class="c-op"><div class="op-name">'+esc(o.nom)+(o.posventa?'<span class="op-tag">POSTVENTA</span>':'')+'</div>';
  h+='<div class="op-row"><span class="op-st aus">Ausente</span><div class="op-eff n"><b>—</b><span>'+(o.posventa?'efic. postventa':'efic.')+'</span></div></div>';
  h+='<div class="occ"><span class="lbl">No suma a la eficiencia</span></div></div>';
  h+='<div class="c-mid">'+tl+'<div class="ords"></div></div>';
  h+='<div class="c-cur"><div class="aus-card"><b>OPERARIO AUSENTE</b><span>'+esc(o.ausenteMotivo||'sin fichada hoy')+'</span></div></div></div>';
  return h;
}

function operarioHTML(o,D){
  if(o.ausente) return ausenteHTML(o,D);
  var bl=o.bloques.slice().sort(function(a,b){ return a.iniMin-b.iniMin; });
  var actual = bl.filter(function(b){ return b.curso; })[0] || (bl.length ? bl[bl.length-1] : null);
  var al = calcAlarma(o,D);
  var alarmaActiva = al && !al.ack;
  if(al){ ALARMAS_INFO[al.clave]=al; if(!al.ack) ALARMAS.push(al); }
  var ocup = (o.ocupacion!=null ? o.ocupacion : ocupacion(o,D));
  var effC = effClass(o.eficiencia);
  var rend = o.rendimiento!=null ? o.rendimiento+'%' : '—';

  var cls='oprow'+(alarmaActiva ? (al.sinReg?' sinreg':' alarma') : '');
  var h='<div class="'+cls+'">';

  // izquierda
  h+='<div class="c-op"><div class="op-name">'+esc(o.nom)+(o.posventa?'<span class="op-tag">POSTVENTA</span>':'')+'</div>';
  h+='<div class="op-row">';
  if(o.sinUsuario) h+='<span class="op-st idle">No está en Odoo</span>';
  else if(o.enCurso) h+='<span class="op-st curso">● En tarea</span>';
  else if(o.presenteAhora===false) h+='<span class="op-st aus">Se retiró</span>';
  else if(!o.bloques.length) h+='<span class="op-st idle">Sin registro</span>';
  else h+='<span class="op-st idle">⚠ Sin tarea</span>';
  h+='<div class="op-eff '+effC+'" title="Eficiencia = rendimiento de tareas ('+rend+') × ocupación de jornada ('+ocup+'%)"><b>'+(o.eficiencia!=null?o.eficiencia+'%':'—')+'</b><span>'+(o.posventa?'efic. postventa':'efic.')+'</span></div></div>';
  h+='<div class="occ"><span class="lbl">Ocup. '+ocup+'% · Rend. '+rend+'</span><div class="trk"><i style="width:'+ocup+'%"></i></div></div></div>';

  // centro
  h+='<div class="c-mid">'+timelineHTML(o,D)+'<div class="ords'+(o.ordenes.length>2?' many':'')+'">';
  if(!o.ordenes.length) h+='<span class="ord"><span class="lb">Sin órdenes iniciadas hoy</span></span>';
  o.ordenes.forEach(function(ord){
    var act = actual && actual.mo===ord.mo;
    var lbl = String(ord.label), ix = lbl.lastIndexOf(' #'), base = ix>0 ? lbl.substring(0,ix) : lbl, cod = ix>0 ? lbl.substring(ix) : '';
    h+='<span class="ord'+(act?' act':'')+'" title="'+esc(ord.label)+' · avance de la orden: '+ord.avance+'%"><span class="fill" style="width:'+ord.avance+'%"></span><span class="lb">ORDEN</span><span class="n">'+esc(base)+'</span>'+(cod?'<span class="c">'+esc(cod)+'</span>':'')+'<span class="p">'+ord.avance+'%</span></span>';
  });
  h+='</div></div>';

  // derecha
  h+='<div class="c-cur">';
  if(alarmaActiva){
    h+='<div class="alrm'+(al.sinReg?' silent':'')+'" onclick="abrirAlarma(\''+al.clave.replace(/'/g,"\\'")+'\')">';
    h+= al.sinReg ? '<b>SIN REGISTRO HOY</b><span>desde las '+hhmm(al.desde)+' · tocá para registrar acción</span>'
                  : '<b>⚠ '+al.min+' MIN SIN TAREA</b><span>Tocá para registrar la acción</span>';
    h+='</div>';
  } else if(actual){
    var i=REG.push({ wof:actual.wof, wo:actual.tarea, mo:actual.moLabel, opn:o.nom, ini:actual.ini, fin:actual.curso?'ahora':actual.fin, obj:actual.obj, rmin:actual.real, estado:actual.estado, curso:actual.curso })-1;
    var ov = actual.obj>0 ? (actual.over>0 ? '+'+fmtM(actual.over) : 'en tiempo') : 'sin estándar';
    h+='<div class="cur '+actual.estado+'" onclick="abrirVal('+i+')">';
    if(VALIDACIONES_HOY[String(actual.wof)]) h+='<span class="vb">✓ Validada</span>';
    h+='<div class="k">'+(actual.curso?'Tarea actual':'Última tarea')+' · '+esc(actual.moLabel)+' · '+esc(actual.ini)+(actual.curso?'–ahora':'–'+esc(actual.fin))+'</div>';
    h+='<div class="nm">'+esc(actual.tarea)+'</div>';
    h+='<div class="tm"><span>REAL <b>'+fmtM(actual.real)+'</b></span><span>ESTÁNDAR <b>'+(actual.obj?fmtM(actual.obj):'—')+'</b></span><span class="ov '+actual.estado+'">'+ov+'</span></div>';
    if(al && al.ack) h+='<span class="ackok">✓ '+esc(al.ack.accion)+'</span>';
    h+='</div>';
  } else {
    h+='<div class="alrm silent"><b>SIN TAREAS</b></div>';
  }
  h+='</div></div>';
  return h;
}

function rulerHTML(D){
  var n=(D.finDia-D.iniDia)/60, h='<div></div><div class="hrs">';
  for(var k=0;k<n;k++) h+='<span>'+hhmm(D.iniDia+k*60)+'</span>';
  return h+'</div><div></div>';
}

function gaugeHTML(val,label){
  return '<div class="gauge '+effClass(val)+'"><div class="num">'+(val!=null?val+'%':'—')+'</div><div class="lbl">'+label+'</div></div>';
}

function render(D){
  ULTIMO = D;
  REG = []; ALARMAS = []; ALARMAS_INFO = {};
  document.getElementById('reloj').textContent = D.hora;
  document.getElementById('fechaTxt').textContent = (D.hist?'📅 ':'') + D.fecha + (D.hist?' · día cerrado':' · en vivo');
  document.getElementById('btnHoy').style.display = D.hist ? '' : 'none';
  aplicarFiltro();

  ['BSAS','CBA'].forEach(function(suc){
    var lst = (D.operarios||[]).filter(function(o){ return o.suc===suc; });
    document.getElementById('rows'+suc).innerHTML = lst.length ? lst.map(function(o){ return operarioHTML(o,D); }).join('') : '<div class="empty">Sin operarios</div>';
    document.getElementById('ruler'+suc).innerHTML = rulerHTML(D);
    var s = (D.sucursales||{})[suc] || {};
    var g = gaugeHTML(s.eficiencia,'Eficiencia<br>sucursal '+suc);
    if(suc==='CBA' && D.postventa) g += gaugeHTML(D.postventa.eficiencia,'Eficiencia<br>postventa CBA');
    document.getElementById('gauges'+suc).innerHTML = g;
  });
  actualizarAlarmas();
}

/* ================== CARGA ================== */
var offsetDias = 0;
function pad2(n){ return (n<10?'0':'')+n; }
function fechaOffset(n){ var d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function diaAnterior(){ offsetDias++; CARGANDO=false; cargar(); }
function diaHoy(){ offsetDias=0; CARGANDO=false; cargar(); }

function mostrarError(msg){
  var el=document.getElementById('off'); el.textContent='⚠ SIN CONEXIÓN — '+msg+' — mostrando últimos datos'; el.style.display='block';
}

var CARGANDO=false, CARGA_T=0, ULTIMO_OK=(new Date()).getTime();

function cargar(fresh){
  fresh = (fresh===true);
  var ahoraMs=(new Date()).getTime();
  if(CARGANDO && !fresh && (ahoraMs-CARGA_T)<70000) return;
  CARGANDO=true; CARGA_T=ahoraMs;
  var f = offsetDias>0 ? fechaOffset(offsetDias) : '';
  var url = URL_API + (f?('&fecha='+f):'') + (fresh?'&fresh=1':'') + '&t=' + ahoraMs;
  jsonp_(url, function(D){
    CARGANDO=false;
    if(!D.ok){ mostrarError(D.error||'error del servidor'); estadoCarga('El servidor respondió con un error: '+(D.error||'desconocido')); if(!ULTIMO) recuperarUltimo(); return; }
    ULTIMO_OK=(new Date()).getTime();
    document.getElementById('off').style.display='none';
    try{ localStorage.setItem('hxh_last', JSON.stringify(D)); }catch(e){}
    if(ULTIMO && ULTIMO.fecha!==D.fecha) VALIDACIONES_HOY={};
    (D.validaciones||[]).forEach(function(v){ VALIDACIONES_HOY[String(v.wof)] = v; });
    render(D);
    // si lo guardado en el servidor tiene más de 20 s, se pide el dato nuevo a Odoo en segundo plano
    if(!fresh && !D.hist && D.edad>20) setTimeout(function(){ cargar(true); },50);
  }, function(e){ CARGANDO=false; mostrarError(e.message); estadoCarga('No se pudo conectar: '+e.message); if(!ULTIMO) recuperarUltimo(); });
}
function recuperarUltimo(){
  try{
    var u=JSON.parse(localStorage.getItem('hxh_last')||'null');
    if(u && u.fecha===fechaOffset(0)) render(u);
  }catch(e){}
}

// validaciones y avisos compartidos entre pantallas (se consulta cada 5 s, es una lectura liviana)
var SINC_ENV=false, SINC_T=0;
function sincronizar(){
  if(!ULTIMO) return;
  var ahoraMs=(new Date()).getTime();
  if(SINC_ENV && (ahoraMs-SINC_T)<30000) return;
  SINC_ENV=true; SINC_T=ahoraMs;
  var fecha = ULTIMO.fecha;
  jsonp_(URL_BASE+'?view=estado&fecha='+fecha+'&t='+ahoraMs, function(E){
    SINC_ENV=false;
    if(!E || !E.ok || !ULTIMO || E.fecha!==ULTIMO.fecha) return;
    var cambio=false;
    (E.validaciones||[]).forEach(function(v){
      var k=String(v.wof);
      if(!VALIDACIONES_HOY[k]){ VALIDACIONES_HOY[k]=v; cambio=true; }
    });
    (E.acks||[]).forEach(function(a){
      var k=fecha+'|'+a.operario+'|'+toMin(a.desde);
      if(!ACKS[k]){ ACKS[k]={accion:a.accion,ts:Date.now()}; cambio=true; }
    });
    if(cambio){
      try{ localStorage.setItem('hxh_acks', JSON.stringify(ACKS)); }catch(e){}
      render(ULTIMO);
    }
  }, function(){ SINC_ENV=false; });
}

aplicarFiltro();
cargar();
setInterval(function(){ cargar(false); }, 10000);
setInterval(sincronizar, 5000);
// si pasan 5 minutos sin datos buenos, la página se recarga sola
setInterval(function(){ if(((new Date()).getTime()-ULTIMO_OK)>300000){ location.reload(); } }, 30000);

/* ================== PANTALLA COMPLETA ================== */
function pantallaCompleta(){
  var d=document, el=d.documentElement;
  var en = d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(en){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
    else { (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen).call(el); }
  }catch(e){}
}
document.addEventListener('dblclick', function(e){ if(!(e.target.closest&&e.target.closest('#informe'))) pantallaCompleta(); });

/* ================== INFORME DEL DÍA ================== */
var INF_SUC = 'TODAS';
function abrirInforme(){
  if(!ULTIMO){ return; }
  document.getElementById('informe').classList.add('on');
  renderInforme();
}
function cerrarInforme(){ document.getElementById('informe').classList.remove('on'); }
function setInfSuc(s){
  INF_SUC = s;
  Array.prototype.forEach.call(document.querySelectorAll('.inf-seg [data-suc]'), function(b){
    if(b.getAttribute('data-suc')===s) b.classList.add('on'); else b.classList.remove('on');
  });
  renderInforme();
}

function renderInforme(){
  var D = ULTIMO; if(!D) return;
  document.getElementById('infTitulo').textContent = 'Informe del día · ' + D.fecha;
  document.getElementById('infSub').textContent = D.hist ? ('cerrado · hasta las ' + hhmm(D.finDia)) : ('en vivo · hasta las ' + D.hora);

  var ops = (D.operarios||[]).filter(function(o){ return INF_SUC==='TODAS' || o.suc===INF_SUC; });
  var opsConEf = ops.filter(function(o){ return !o.posventa && !o.ausente && o.eficiencia!=null; });
  var efProm = opsConEf.length ? Math.round(opsConEf.reduce(function(a,o){return a+o.eficiencia;},0)/opsConEf.length) : null;
  var ausentes = ops.filter(function(o){ return o.ausente; });

  // todas las tareas (bloques) de los operarios filtrados, ordenadas por hora
  var tareas = [];
  ops.forEach(function(o){
    (o.bloques||[]).forEach(function(b){
      tareas.push({ op:o.nom, suc:o.suc, posventa:o.posventa, ini:b.ini, fin:b.curso?'ahora':b.fin, curso:b.curso,
        tarea:b.tarea, mo:b.moLabel, obj:b.obj, real:b.real, over:b.over, estado:b.estado, wof:b.wof });
    });
  });
  tareas.sort(function(a,b){ return toMin(a.ini)-toMin(b.ini); });

  var cVerde=0,cAmarillo=0,cRojo=0;
  tareas.forEach(function(t){ if(t.estado==='verde')cVerde++; else if(t.estado==='amarillo')cAmarillo++; else cRojo++; });

  var h = '';
  // --- tarjetas resumen ---
  h += '<div class="inf-cards">';
  h += '<div class="inf-card '+effClass(efProm)+'"><div class="n">'+(efProm!=null?efProm+'%':'—')+'</div><div class="l">Eficiencia promedio'+(INF_SUC!=='TODAS'?(' '+INF_SUC):'')+'</div></div>';
  h += '<div class="inf-card"><div class="n">'+ops.length+'</div><div class="l">Operarios</div></div>';
  h += '<div class="inf-card '+(ausentes.length?'b':'g')+'"><div class="n">'+ausentes.length+'</div><div class="l">Ausentes</div></div>';
  h += '<div class="inf-card"><div class="n">'+tareas.length+'</div><div class="l">Tareas registradas</div></div>';
  h += '<div class="inf-card g"><div class="n">'+cVerde+'</div><div class="l">En tiempo</div></div>';
  h += '<div class="inf-card w"><div class="n">'+cAmarillo+'</div><div class="l">Hasta +15 min</div></div>';
  h += '<div class="inf-card b"><div class="n">'+cRojo+'</div><div class="l">Más de +15 min</div></div>';
  h += '</div>';

  // --- por sucursal (si se ve "Todas") ---
  if(INF_SUC==='TODAS'){
    h += '<div class="inf-sec-title">Eficiencia por sucursal</div>';
    h += '<table class="inf-table"><tr><th>Sucursal</th><th>Operarios</th><th>Eficiencia</th></tr>';
    ['BSAS','CBA'].forEach(function(s){
      var si=(D.sucursales||{})[s]||{};
      h+='<tr><td>'+s+'</td><td>'+(si.operarios!=null?si.operarios:'—')+'</td><td>'+(si.eficiencia!=null?si.eficiencia+'%':'—')+'</td></tr>';
    });
    if(D.postventa) h+='<tr><td>Postventa CBA ('+esc(D.postventa.nom)+')</td><td>1</td><td>'+(D.postventa.eficiencia!=null?D.postventa.eficiencia+'%':'—')+'</td></tr>';
    h += '</table>';
  }

  // --- operarios ---
  h += '<div class="inf-sec-title">Operarios</div>';
  h += '<table class="inf-table"><tr><th>Nombre</th><th>Sucursal</th><th>Estado</th><th>Ocupación</th><th>Rendimiento</th><th>Eficiencia</th></tr>';
  ops.forEach(function(o){
    var estado = o.ausente ? ('Ausente'+(o.ausenteMotivo?(' ('+esc(o.ausenteMotivo)+')'):''))
      : (o.presenteAhora===false ? 'Se retiró' : (o.enCurso ? 'En tarea' : (o.bloques&&o.bloques.length ? 'Sin tarea ahora' : 'Sin registro')));
    h+='<tr><td>'+esc(o.nom)+(o.posventa?' <span class="inf-pill ok">POSTVENTA</span>':'')+'</td><td>'+esc(o.suc)+'</td><td>'+estado+'</td>' +
       '<td>'+(o.ocupacion!=null?o.ocupacion+'%':'—')+'</td><td>'+(o.rendimiento!=null?o.rendimiento+'%':'—')+'</td>' +
       '<td>'+(o.eficiencia!=null?o.eficiencia+'%':'—')+'</td></tr>';
  });
  h += '</table>';

  // --- todas las tareas del día ---
  h += '<div class="inf-sec-title">Tareas del día'+(INF_SUC!=='TODAS'?(' · '+INF_SUC):'')+'</div>';
  if(!tareas.length){ h += '<div class="inf-empty">Sin tareas registradas.</div>'; }
  else {
    h += '<table class="inf-table"><tr><th>Hora</th><th>Operario</th><th>Orden</th><th>Tarea</th><th>Estándar</th><th>Real</th><th>Estado</th><th>Validación</th></tr>';
    tareas.forEach(function(t){
      var val = VALIDACIONES_HOY[String(t.wof)];
      h+='<tr><td>'+esc(t.ini)+'–'+esc(t.fin)+'</td><td>'+esc(t.op)+'</td><td>'+esc(t.mo)+'</td><td>'+esc(t.tarea)+'</td>' +
         '<td>'+(t.obj?fmtM(t.obj):'—')+'</td><td>'+fmtM(t.real)+'</td>' +
         '<td><span class="inf-dot '+t.estado+'"></span>'+(t.curso?'En curso':(t.estado==='verde'?'En tiempo':(t.estado==='amarillo'?'+15m':'+15m grave')))+'</td>' +
         '<td>'+(val?('<span class="inf-pill ok">'+esc(val.validacion)+'</span>'+(val.causal?(' '+esc(val.causal)):'')):'<span class="inf-pill no">sin validar</span>')+'</td></tr>';
    });
    h += '</table>';
  }

  // --- ineficiencias graves ---
  var graves = tareas.filter(function(t){ return t.estado==='rojo'; });
  h += '<div class="inf-sec-title">Ineficiencias graves (+15 min sobre el estándar)</div>';
  if(!graves.length){ h += '<div class="inf-empty">No hubo tareas con desvío grave.</div>'; }
  else {
    h += '<table class="inf-table"><tr><th>Hora</th><th>Operario</th><th>Tarea</th><th>Estándar</th><th>Real</th><th>Desvío</th><th>Causal</th><th>Nota</th></tr>';
    graves.forEach(function(t){
      var val = VALIDACIONES_HOY[String(t.wof)];
      h+='<tr class="inf-graveRow"><td>'+esc(t.ini)+'–'+esc(t.fin)+'</td><td>'+esc(t.op)+'</td><td>'+esc(t.tarea)+'</td>' +
         '<td>'+(t.obj?fmtM(t.obj):'—')+'</td><td>'+fmtM(t.real)+'</td><td>+'+fmtM(t.over)+'</td>' +
         '<td>'+(val&&val.causal?esc(val.causal):'<span class="inf-pill no">sin validar</span>')+'</td>' +
         '<td>'+(val&&val.nota?esc(val.nota):'—')+'</td></tr>';
    });
    h += '</table>';
  }

  // --- ausentes ---
  if(ausentes.length){
    h += '<div class="inf-sec-title">Ausentes</div>';
    h += '<table class="inf-table"><tr><th>Nombre</th><th>Sucursal</th><th>Motivo</th></tr>';
    ausentes.forEach(function(o){ h+='<tr><td>'+esc(o.nom)+'</td><td>'+esc(o.suc)+'</td><td>'+esc(o.ausenteMotivo||'—')+'</td></tr>'; });
    h += '</table>';
  }

  document.getElementById('informe-body').innerHTML = h;
}

/* ================== INFORME: SUBIR / BAJAR / AUTOMÁTICO ================== */
(function(){
  var st=document.createElement('style');
  st.textContent='#informe-body{scroll-behavior:smooth}.inf-btn.big{font-size:18px;padding:10px 20px}';
  document.head.appendChild(st);
  var seg=document.querySelector('.inf-seg'); if(!seg) return;
  function cuerpo(){ return document.getElementById('informe-body'); }
  function paso(dir){ var b=cuerpo(); b.style.scrollBehavior='smooth'; b.scrollTop = b.scrollTop + dir*Math.round(b.clientHeight*0.8); }
  var auto=null, bAuto;
  function pararAuto(){ if(auto){ clearInterval(auto); auto=null; } if(bAuto){ bAuto.textContent='▶ Auto'; bAuto.classList.remove('on'); } }
  function iniciarAuto(){
    var b=cuerpo(), espera=0;
    b.style.scrollBehavior='auto';
    bAuto.textContent='⏸ Auto'; bAuto.classList.add('on');
    auto=setInterval(function(){
      if(espera>0){ espera--; return; }
      var antes=b.scrollTop;
      b.scrollTop = antes + 2;
      if(b.scrollTop===antes){ espera=60; if(antes>0){ b.scrollTop=0; } else { pararAuto(); } }
    },30);
  }
  function mk(txt,fn){ var x=document.createElement('button'); x.className='inf-btn big'; x.textContent=txt; x.onclick=fn; return x; }
  var bSubir=mk('▲ Subir',function(){ pararAuto(); paso(-1); });
  var bBajar=mk('▼ Bajar',function(){ pararAuto(); paso(1); });
  bAuto=mk('▶ Auto',function(){ if(auto) pararAuto(); else iniciarAuto(); });
  seg.insertBefore(bAuto,seg.firstChild);
  seg.insertBefore(bBajar,seg.firstChild);
  seg.insertBefore(bSubir,seg.firstChild);
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('informe').classList.contains('on')) return;
    var k=e.key||'';
    if(k==='ArrowDown'||k==='PageDown'||k===' '){ pararAuto(); paso(1); e.preventDefault(); }
    else if(k==='ArrowUp'||k==='PageUp'){ pararAuto(); paso(-1); e.preventDefault(); }
    else if(k==='Escape'){ pararAuto(); cerrarInforme(); }
  });
  var _cerrar=cerrarInforme;
  cerrarInforme=function(){ pararAuto(); _cerrar(); };
})();
</script>
